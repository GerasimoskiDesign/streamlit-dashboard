[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salesreport"
version = "1.0.0"
description = "Event-level sales reporting engine and role-based Streamlit dashboard (synthetic data)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mario Gerasimoski" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "plotly>=5.20",
    "streamlit>=1.50",
    "bcrypt>=4.1",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
screenshots = [
    "playwright>=1.44",
]

[project.scripts]
salesreport = "salesreport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
salesreport = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
